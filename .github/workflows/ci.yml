name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      # Fails below the fail_under threshold in pyproject.toml.
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vietnam-travel .
      - run: docker run -d -p 8501:8501 vietnam-travel
      - name: Wait for Streamlit health endpoint
        run: |
          for i in $(seq 1 10); do
            status=$(curl -sf http://localhost:8501/_stcore/health 2>/dev/null) && [ "$status" = "ok" ] && exit 0
            sleep 3
          done
          echo "Streamlit did not become healthy after 30s" && exit 1

  # The README quotes reports/evaluation.md, so it must be what the script produces today.
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/evaluate.py
      - name: Report matches the committed one
        run: git diff --exit-code reports/
